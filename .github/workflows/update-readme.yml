name: Update README

on:
  schedule:
    - cron: "17 3 * * *"   # daily — follows the resume link set in the portfolio admin panel
  workflow_dispatch: {}    # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - profile.yml
      - scripts/build_profile.py
      - scripts/svg_kit.py
      - scripts/profile_data.py
      - README.md
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Build footer and resume badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: altf4-games
        run: python scripts/build_profile.py

      # Output is deterministic, so quiet days add no history.
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --staged --quiet || git commit -m "chore: update README"
          git push
