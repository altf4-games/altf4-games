# ---------------------------------------------------------------------------
# Single place to edit the profile README.
# Edit this file (even from the GitHub web editor) and the workflows rebuild
# the terminal card, the wins card, the README and the Doom HUD.
#
# Open-source PRs are NOT listed here: they are fetched from GitHub
# automatically (merged PRs you authored in repos you don't own).
# ---------------------------------------------------------------------------

terminal:
  user: pradyum
  host: altf4
  tagline: "games. web. ai."
  location: "Mumbai, IN · UTC+5:30"
  # Keep it short — the stack is shown as icons below the card.
  # {oss_prs} is replaced with your live count of merged open-source PRs.
  rows:
    - [OS,       "B.Tech Computer Engineering @ KJSCE"]
    - [Host,     "Barclays (remote)"]
    - [Uptime,   "10 yrs of coding · CGPA 9.63"]
    - [Kernel,   "Game Dev · Full Stack · AI/ML"]
    - [Packages, "{oss_prs} open-source PRs merged"]
    - [CPU,      "Brain @ overclocked, sleep-deprived"]
    - [Loading,  "next game jam ▰▰▰▱▱"]

# Shown as the wins card and in the Doom HUD. Keep it to the best 3-4.
achievements:
  - badge: Winner
    title: Hedera Track
    event: ETHGlobal ETHOnline 2026
  - badge: Winner
    title: Most Addictive Game
    event: 8th Wall Game Jam
  - badge: 1st Runner-Up
    title: ISTE Pixel Wars
    event: + 5x hackathon finalist

# Auto-fetched open-source PR list.
prs:
  limit: 5            # how many cards to show
  exclude_repos: []   # e.g. ["someorg/somerepo"] to hide a repo
