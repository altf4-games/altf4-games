# ---------------------------------------------------------------------------
# Single place to edit the profile README.
# Edit this file (even from the GitHub web editor) and the workflows rebuild
# the terminal animation (neofetch, Doom, wins, work, PRs) and the footer.
#
# Open-source PRs are NOT listed here: they are fetched from GitHub
# automatically (merged PRs you authored in repos you don't own).
# ---------------------------------------------------------------------------

terminal:
  user: altf4-games
  host: github
  # Logo = the colored ASCII art in ascii-art.html (dark) / ascii-art_light.html (light)
  # Values longer than the card are clipped with …
  # {oss_prs} is replaced with your live count of merged open-source PRs.
  rows:
    - [OS,       "B.Tech Computer Engineering @ KJSCE '27"]
    - [Host,     "SWE Intern @ Barclays (Investment Banking)"]
    - [Kernel,   "Game Dev · Full Stack · AI/ML"]
    - [Uptime,   "10 yrs of coding · CGPA 9.63/10"]
    - [Packages, "22 games shipped · 100k+ downloads"]
    - [PRs,       "{oss_prs} merged into open source"]
    - [Languages, "C++ · C# · Python · Go · TypeScript"]
    - [Stack,     "React · Next.js · FastAPI · Flutter"]
    - [Engines,   "Unity · Unreal Engine"]
    - [Cloud,     "AWS · Docker · Kubernetes · PostgreSQL"]
    - [CPU,       "Brain @ overclocked, sleep-deprived"]

experience:
  - role: Software Engineering Intern
    org: Barclays (Investment Banking)
    when: Jun 2026 – Aug 2026
    what: React/FastAPI tooling over a 1.17M-row table · graph-based task engine · Kafka
  - role: Game Development & XR Intern
    org: VyuXR Immersive Studios
    when: May 2025 – Jun 2025
    what: Unity mixed-reality features · 30% drop in crash rates
  - role: Founder & Sole Developer
    org: ALTF4 Games
    when: 2016 – present
    what: 22 titles, 100k+ downloads · Captive ported to Nintendo via Upscale Studio

# Shown in the terminal's `cat wins` and as Doom messages. Keep it to the best 3-4.
achievements:
  - badge: Winner
    title: Hedera Track
    event: ETHGlobal ETHOnline 2026
  - badge: Winner
    title: Most Addictive Game
    event: 8th Wall Forge the Future Game Jam
  - badge: 1st Runner-Up
    title: ISTE Pixel Wars
    event: + finalist at ACM Aftermath, KJSSE HACK 8, iDEA

# Auto-fetched open-source PR list.
prs:
  limit: 5            # how many PRs to show
  exclude_repos: []   # e.g. ["someorg/somerepo"] to hide a repo
